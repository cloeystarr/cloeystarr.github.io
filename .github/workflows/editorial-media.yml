name: Editorial media review
on:
  push:
    paths:
      - 'journal/**'
      - 'portals/**'
      - 'assets/**'
      - 'content/**'
      - 'script.js'
      - 'history-posts.js'
      - 'scripts/**'
      - '.github/workflows/editorial-media.yml'
  pull_request:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 scripts/check_editorial_media.py
